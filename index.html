<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24594b"><meta name="referrer" content="no-referrer">
<title>모여 — 우리들의 채팅방</title><link rel="stylesheet" href="./styles.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모여">
</head>
<body>
<main class="shell">
<header><div class="brand">모여<span>작은 대화가 모이는 곳</span></div><button id="rename" type="button" hidden>프로필 변경</button></header>
<section class="room"><div><span class="eyebrow">OUR LITTLE SPACE</span><h1>우리들의 채팅방 <span class="dot"></span></h1><p>안부도, 오늘 찍은 사진도. 편하게 남겨요.</p></div><span class="room-tag">공용 채팅방 · 최근 100개</span></section>
<aside class="push-panel" aria-label="기기 알림"><div class="push-heading"><strong>새 메시지 알림</strong><div class="push-actions"><button id="push-enable" type="button" disabled>알림 켜기</button><button id="push-test" type="button" disabled>테스트 알림</button><button id="push-disable" type="button" disabled>알림 끄기</button></div></div><p id="push-status" role="status">기기 알림을 준비하고 있어요…</p></aside>
<div id="status" role="status">앱을 준비하고 있어요…</div>
<section id="join" class="join"><div class="welcome-icon" aria-hidden="true">✳</div><h2>어떤 이름으로 만날까요?</h2><p>친구들이 알아볼 수 있는 닉네임을 입력해 주세요.</p><form id="join-form"><div class="profile-picker"><div id="avatar-preview" class="avatar"></div><div><label for="avatar-file">프로필 사진 (선택)</label><input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp"><button id="avatar-remove" type="button">기본 이미지로</button></div></div><label for="nickname">닉네임</label><div class="join-row"><input id="nickname" maxlength="20" required autocomplete="nickname" placeholder="예: 민수"><button id="join-button" disabled>입장하기 →</button></div></form><small>로그인 없는 공개 공간이에요. 개인정보는 남기지 마세요.</small></section>
<section id="chat" hidden aria-label="공용 채팅방">
<div id="messages" role="log" aria-label="최근 메시지" aria-live="polite" aria-relevant="additions"></div>
<button id="latest" type="button" hidden>새 대화 · 아래로 ↓</button>
<form id="composer"><div id="attachment" hidden><img id="preview" alt="전송할 사진 미리보기"><span id="filename"></span><button id="remove" type="button" aria-label="첨부 사진 제거">✕</button></div>
<div class="compose-row"><label class="photo-button" title="사진 첨부">＋<span class="sr-only">사진 첨부</span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" class="sr-only"></label><textarea id="text" rows="1" maxlength="2000" placeholder="친구들에게 한마디…" aria-label="메시지"></textarea><button id="send" type="submit">보내기 ↑</button></div>
<div class="compose-hint"><span>JPG · PNG · WebP / 최대 5MB</span><span>Enter 전송 · Shift+Enter 줄바꿈</span></div></form>
</section><footer>조금 멀리 있어도, 대화는 가까이.</footer>
</main>
<dialog id="viewer"><button id="close-viewer" autofocus aria-label="사진 닫기">닫기 ✕</button><img id="full-image" alt="채팅 사진 크게 보기"></dialog>
<noscript>채팅을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
<script type="module" src="./app.js"></script>
</body></html>
