<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모여 푸시 키 생성</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;line-height:1.7;color:#253d35}button{padding:12px;background:#24594b;color:white;border:0;border-radius:8px}textarea{width:100%;box-sizing:border-box;min-height:110px;word-break:break-all}label{display:block;margin-top:20px;font-weight:bold}</style><h1>푸시 알림 키 만들기</h1><p>키는 이 브라우저 안에서 생성됩니다. 네트워크로 전송하거나 파일에 저장하지 않습니다. 처음 한 번만 생성하고 값을 안전한 곳에 보관하세요. 다시 생성하면 기존 기기는 알림을 다시 켜야 합니다.</p><button id="generate">키 생성하기</button><p id="status" role="status"></p><label for="public">공개 키 → config.js의 vapidPublicKey</label><textarea id="public" readonly></textarea><label for="private">비밀 키 → Cloudflare의 VAPID_PRIVATE_JWK Secret에만 입력</label><textarea id="private" readonly></textarea><p>비밀 키는 GitHub, config.js, 채팅에 올리지 마세요. 이 도구 파일 자체에는 키가 들어 있지 않습니다.</p><script>
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
document.getElementById('generate').onclick=async()=>{try{const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);document.getElementById('public').value=b64(await crypto.subtle.exportKey('raw',pair.publicKey));document.getElementById('private').value=JSON.stringify(await crypto.subtle.exportKey('jwk',pair.privateKey));document.getElementById('status').textContent='생성했어요. 두 값을 각각 지정된 위치에 복사하세요.';}catch{document.getElementById('status').textContent='브라우저가 키 생성을 지원하지 않습니다. 최신 Chrome 또는 Safari에서 HTTPS 주소로 여세요.';}};
</script></html>
